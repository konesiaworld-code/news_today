name: 뉴스 수집

on:
  schedule:
    - cron: '7 * * * *'   # 매시간 7분 (UTC 기준)
  workflow_dispatch:      # Actions 탭에서 수동 실행 가능

permissions:
  contents: write

concurrency:
  group: collect-news
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: collector/requirements.txt

      # 원본 기사 목록(data/raw)은 저장소에 올리지 않고 Actions 캐시에 보관합니다.
      - name: 원본 목록 불러오기
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - run: pip install -r collector/requirements.txt

      - run: python collector/collect.py

      - name: 결과 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/index.json data/daily
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M') KST"
            git pull --rebase
            git push
          fi

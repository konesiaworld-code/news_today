name: 폭탄 타이머 APK 빌드

on:
  push:
    paths:
      - 'bomb_timer/**'
      - '.github/workflows/bomb_timer_apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: bomb_timer
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release

      - name: 카톡 전송용 zip 만들기
        run: |
          mkdir -p ../dist
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('../dist/때지의 스탑워치.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              z.write('build/app/outputs/flutter-apk/app-release.apk', '때지의 스탑워치.apk')
          PY

      - name: APK 올리기
        uses: actions/upload-artifact@v4
        with:
          name: 때지의 스탑워치
          path: bomb_timer/build/app/outputs/flutter-apk/app-release.apk

      - name: zip 저장소에 저장
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "dist/때지의 스탑워치.zip"
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "dist: 때지의 스탑워치.zip 빌드"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

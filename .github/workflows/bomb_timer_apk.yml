name: 폭탄 타이머 APK 빌드

on:
  push:
    paths:
      - 'bomb_timer/**'
      - '.github/workflows/bomb_timer_apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: bomb_timer
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release

      - name: APK 올리기
        uses: actions/upload-artifact@v4
        with:
          name: bomb-timer-apk
          path: bomb_timer/build/app/outputs/flutter-apk/app-release.apk

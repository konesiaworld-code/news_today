name: APK 빌드

# 앱 설치 파일(APK)을 만들어 Actions 실행 결과의 'Artifacts'에 올립니다.
# Actions 탭 → APK 빌드 → Run workflow 로 언제든 다시 만들 수 있습니다.
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['lib/**', 'android/**', 'pubspec.*', 'assets/**', '.github/workflows/build-apk.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 개인 사진 아이콘은 저장소에 올리지 않으므로(.gitignore), 없으면 Flutter 기본 아이콘을 씁니다.
      - name: 아이콘 없으면 기본 아이콘 사용
        run: |
          if ! ls android/app/src/main/res/mipmap-*/ic_launcher_foreground.png >/dev/null 2>&1; then
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
            sed -i '/android:roundIcon=/d' android/app/src/main/AndroidManifest.xml
            echo "기본 아이콘으로 빌드합니다"
          fi

      # 저장소에 없는 Flutter 기본 파일(gradle wrapper 등)을 채웁니다. 이미 있는 파일은 덮어쓰지 않습니다.
      - run: flutter create . --project-name news_today --org com.newstoday --platforms android

      - run: flutter pub get

      - run: flutter build apk --release

      - name: 이름 바꾸기
        run: cp build/app/outputs/flutter-apk/app-release.apk news_today.apk

      - uses: actions/upload-artifact@v4
        with:
          name: news_today-apk
          path: news_today.apk
          retention-days: 30
